---
- name: "Base mysql setup"
  ansible.builtin.include_tasks: "base_setup.yml"

- name: "Install cluster nodes"
  ansible.builtin.include_tasks: "setup_cluster_node.yml"
  when:
    - "mysql_cluster"
    - "not arbiter_node"

- name: "Setup galera cluster"
  ansible.builtin.include_tasks: "setup_galera.yml"
  when:
    - "setup_galera_cluster"
    - "galera_bootstrap_node is defined"
    - "galera_bootstrap_node == inventory_hostname"

- name: "Install arbiter node"
  ansible.builtin.include_tasks: "setup_arbiter.yml"
  when:
    - "mysql_cluster"
    - "arbiter_node"

- name: "Setup galera cluster"
  ansible.builtin.include_tasks: "setup_galera.yml"
  when:
    - "setup_galera_cluster"
    - "galera_bootstrap_node is defined"
    - "galera_bootstrap_node == inventory_hostname"

- name: "Start and enable mariadb"
  ansible.builtin.service:
    name: "mariadb"
    state: "started"
    enabled: "True"
  when: "galera_bootstrap_node != inventory_hostname"

- name: "Configure databases"
  ansible.builtin.include_tasks: "create_db.yml"
  when:
    - "not mysql_cluster or galera_bootstrap_node == inventory_hostname"

- name: "Setup backup"
  ansible.builtin.include_tasks: "setup_backup.yml"
  when:
    - "not setup_galera_cluster"
    - "not mysql_cluster or galera_bootstrap_node == inventory_hostname"
    - "backup_node | bool"

- name: "Add galera users"
  ansible.builtin.include_tasks: "galera_users.yml"
  when: "galera_bootstrap_node == inventory_hostname"
