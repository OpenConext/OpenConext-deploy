<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenConext build artifacts</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    main {
      max-width: 800px;
      margin: 4rem auto;
      padding: 2rem;
      background: #fff;
      border-radius: 8px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    header img {
      width: 120px;
      height: auto;
    }

    h1 {
      margin: 0;
      font-size: 1.8rem;
    }

    .artifact-list {
      list-style: none;
      padding: 0;
      margin: 1.5rem 0 2rem;
    }

    .artifact-list li {
      margin: 0.5rem 0;
    }

    .artifact-list a {
      display: block;
      padding: 0.8rem 1rem;
      border: 1px solid #ddd;
      border-radius: 5px;
      text-decoration: none;
      color: inherit;
      background: #fafafa;
    }

    .artifact-list a:hover {
      background: #f0f0f0;
    }

    footer {
      margin-top: 2rem;
      font-size: 0.9rem;
      color: #666;
    }

    footer a {
      color: inherit;
    }
  </style>
</head>

<body>
<main>
  <header>
    <img src="openconext.png" alt="OpenConext logo">
    <h1>OpenConext build artifacts distribution server</h1>
  </header>

  <p>Available artifact repositories:</p>

  <ul class="artifact-list">
    <li><a href="/repository/">repository/</a></li>
  </ul>

  <footer>
    For more information, see
    <a href="https://openconext.org/">openconext.org</a>.
  </footer>
</main>
</body>
</html>
