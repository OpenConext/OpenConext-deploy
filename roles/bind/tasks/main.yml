---
- name: "Install bind packages"
  ansible.builtin.apt:
    name: "bind9"
    state: "present"

- name: "Create bind directories"
  ansible.builtin.file:
    dest: "{{ dns_work_dir }}/{{ item }}"
    state: "directory"
    owner: "bind"
    group: "bind"
    mode: "0750"
  loop:
    - "master"
    - "keys"

- name: "Configure bind"
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/bind/{{ item }}"
    owner: "root"
    group: "bind"
    mode: "0640"
  loop:
    - "named.conf.options"
    - "named.conf.local"
  notify:
    - "Restart bind"

- name: "Read current ha zone config file"
  ansible.builtin.slurp:
    src: "{{ dns_work_dir }}/master/hb.{{ base_domain }}.db"
  register: "remote_ha_zone_file"

- name: "Compare files while ignoring the selected line"
  ansible.builtin.set_fact:
    copy_ha_zone_file: >-
      {{
        (lookup('ansible.builtin.template', 'ha_zone_file.j2').splitlines()
         | reject('search', 'Serial') | list)
        !=
        ((remote_ha_zone_file.content | b64decode).splitlines()
         | reject('search', 'Serial') | list)
      }}

- name: "Copy ha zone file"
  ansible.builtin.template:
    src: "ha_zone_file.j2"
    dest: "{{ dns_work_dir }}/master/hb.{{ base_domain }}.db"
    owner: "bind"
    group: "bind"
    mode: "0640"
  notify:
    - "Reload bind"
  when: "copy_ha_zone_file"

- name: "Enable bind service"
  ansible.builtin.service:
    name: "named"
    state: "started"
    enabled: true
