---
- name: "Restart notifications server"
  community.docker.docker_container:
    name: "notifications_server"
    state: "started"
    restart: true
    # avoid restarting it creates unexpected data loss according to docker_container_module notes
    comparisons:
      '*': "ignore"
  when: "notifications_server_container is success and notifications_server_container is not change"

- name: "Restart notifications gui"
  community.docker.docker_container:
    name: "notifications_gui"
    state: "started"
    restart: true
    # avoid restarting it creates unexpected data loss according to docker_container_module notes
    comparisons:
      '*': "ignore"
  when: "notifications_gui_container is success and notifications_gui_container is not change"
