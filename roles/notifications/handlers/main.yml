---
- name: "Restart notifications server"
  community.docker.docker_container:
    name: "notificationsserver"
    state: "started"
    restart: true
    # avoid restarting it creates unexpected data loss according to docker_container_module notes
    comparisons:
      '*': "ignore"
  when: "notificationsserver is success and notificationsserver is not change"

- name: "Restart notifications gui"
  community.docker.docker_container:
    name: "notificationsclient"
    state: "started"
    restart: true
    # avoid restarting it creates unexpected data loss according to docker_container_module notes
    comparisons:
      '*': "ignore"
  when: "notificationsclient is success and notificationsclient is not change"
