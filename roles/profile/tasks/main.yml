---
- name: "Add group {{ profile_group }}"
  ansible.builtin.group:
    name: "{{ profile_group }}"
    state: "present"
  register: "profile_guid"

- name: "Add user {{ profile_user }}"
  ansible.builtin.user:
    name: "{{ profile_user }}"
    group: "{{ profile_user }}"
    create_home: false
    state: "present"
  register: "profile_uid"

- name: "Create some dirs"
  ansible.builtin.file:
    state: "directory"
    path: "{{ item }}"
    owner: "root"
    group: "root"
    mode: "0755"
  with_items:
    - "{{ profile_dir }}"
    - "{{ profile_dir }}/certs"
    - "{{ profile_dir }}/translationoverrides"

- name: "Put parameters YAML config"
  ansible.builtin.template:
    src: "{{ item }}.yml.j2"
    dest: "{{ profile_dir }}/{{ item }}.yaml"
    mode: "0640"
    group: "{{ profile_group }}"
  with_items:
    - "parameters"
    - "global_view_parameters"
  notify:
    - "Restart profile"

- name: "Install the engineblock certificate"
  ansible.builtin.copy:
    src: "{{ inventory_dir }}/files/certs/{{ profile_eb_saml_public_key }}"
    dest: "{{ profile_dir }}/certs/{{ profile_eb_saml_public_key }}"
    mode: "0644"
    owner: "root"
    group: "root"

- name: "Check presence of language specific overrides"
  ansible.builtin.stat:
    path: "{{ inventory_dir }}/files/profile/overrides/"
  delegate_to: "localhost"
  register: "profile_overrides_present"
  become: false

- name: "Copy language specific overrides"
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ profile_dir }}/translationoverrides/"
    mode: "0644"
    owner: "root"
    group: "root"
  when: "profile_overrides_present.stat.exists"
  with_fileglob:
    - "{{ inventory_dir }}/files/profile/overrides/*"
  notify:
    - "Restart profile"

- name: "Create the container"
  community.docker.docker_container:
    name: "profile"
    image: "ghcr.io/openconext/openconext-profile/profile:{{ profile_version }}"
    etc_hosts:
      host.docker.internal: "host-gateway"
    pull: true
    restart_policy: "always"
    networks:
      - name: "loadbalancer"
    labels:
      traefik.http.routers.profile.rule: "Host(`{{ profile_vhost_name }}`)"
      traefik.http.routers.profile.tls: "true"  # MUST be a string
      traefik.enable: "true"  # MUST be a string
    env:
      APACHE_UID: "#{{ profile_uid.uid }}"
      APACHE_GUID: "#{{ profile_guid.gid }}"
      APP_ENV: "prod"
      HTTPD_CSP: "{{ httpd_csp.strict_with_static_img }}"
    mounts:
      - source: "/opt/openconext/profile"
        target: "/var/www/html/config/openconext"
        type: "bind"
      - source: "/opt/openconext/common/favicon.ico"
        target: "/var/www/html/public/favicon.ico"
        type: "bind"
      - source: "/etc/localtime"
        target: "/etc/localtime"
        type: "bind"
  register: "profile_container"

- name: "Include the role manage_provision to provision profile to Manage"
  ansible.builtin.include_role:
    name: "manage_provision"
  vars:
    manage_provision_entity_type: "saml20_sp"
    manage_provision_samlsp_client_id: "{{ profile_manage_provision_samlsp_client_id }}"
    manage_provision_samlsp_name_en: "{{ profile_manage_provision_samlsp_name_en }}"
    manage_provision_samlsp_description_en: "{{ profile_manage_provision_samlsp_description_en }}"
    manage_provision_samlsp_acs_location: "{{ profile_manage_provision_samlsp_acs_location }}"
    manage_provision_samlsp_metadata_url: "{{ profile_manage_provision_samlsp_metadata_url }}"
    manage_provision_samlsp_sp_cert: "{{ profile_manage_provision_samlsp_sp_cert }}"
    manage_provision_samlsp_trusted_proxy: "{{ profile_manage_provision_samlsp_trusted_proxy }}"
    manage_provision_samlsp_sign: "{{ profile_manage_provision_samlsp_sign }}"
