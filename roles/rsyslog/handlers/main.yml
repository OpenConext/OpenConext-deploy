---
- name: "Restart rsyslog"
  ansible.builtin.systemd_service:
    name: "rsyslog"
    state: "restarted"

- name: "Restart journald"
  ansible.builtin.systemd_service:
    name: "systemd-journald"
    state: "restarted"

- name: "Reload systemd"
  ansible.builtin.systemd_service:
    daemon_reload: true
