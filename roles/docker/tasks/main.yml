---
- name: Include Rocky specific tasks
  ansible.builtin.include_tasks: setup-rocky.yml
  when: ansible_os_family == 'RedHat'

- name: Include Debian specific tasks
  ansible.builtin.include_tasks: setup-debian.yml
  when: ansible_os_family == 'Debian'

- name: Install docker
  ansible.builtin.package:
    name: docker-ce
    state: present

- name: Install docker config file
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0744"
  notify: "restart docker"

- name: Start and enable the docker daemon
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Gather some facts, as we want to need info on the docker network interface
  ansible.builtin.setup:
    gather_subset: network

- name: Create the Traefik loadbalancer network
  community.docker.docker_network:
    name: loadbalancer
  when: docker_install_traefik | bool

- name: Include Traefik install tasks
  ansible.builtin.include_tasks: traefik.yml

- name: Create OpenConext common files dir
  ansible.builtin.file:
    state: directory
    path: "/opt/openconext/common/"
    owner: root
    mode: "0755"

- name: Place the favicon files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/opt/openconext/common/"
    owner: root
    group: root
    mode: "0644"
  loop:
    - "favicon.ico"
    - "favicon-eduid.ico"

- name: Create docker prune job
  ansible.builtin.cron:
    name: "docker prune"
    user: "root"
    minute: "23"
    hour: "03"
    job: "docker system prune -a -f"
    cron_file: "docker_prune"
