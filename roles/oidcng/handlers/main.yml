---
- name: "Restart oidcng"
  community.docker.docker_container:
    name: "oidcngserver"
    state: "started"
    restart: true
    # avoid restarting it creates unexpected data loss according to docker_container_module notes
    comparisons:
      '*': "ignore"
  when: "oidcng_servercontainer is success and oidcng_servercontainer is not change"
