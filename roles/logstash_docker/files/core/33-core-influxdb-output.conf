filter {
    if [prog] == "EBAUTH" {
        ruby {
        code => 'require "date";
                 d = DateTime.parse(event.get("[ebauth][context][login_stamp]"));
                 ds = ((d.strftime("%Q").to_i * 1000) + d.strftime("%6N")[3,3].to_i).to_s;
                 event.set("[ebauth][context][micro_seconds]", ds);
                 if (event.get("[ebauth][context][proxied_sp_entity_ids][0]")) ;
                   proxied_sp_entity_id = (event.get("[ebauth][context][proxied_sp_entity_ids][0]"));
                   event.set("[ebauth][context][sp_entity_id]", proxied_sp_entity_id)
                 end'
        }
  }
}
filter {
    if [prog] == "EBAUTH" and [ebauth][context][authncontextclassref] not in ["http://surfconext.nl/assurance/loa1_5","http://surfconext.nl/assurance/loa2","http://surfconext.nl/assurance/loa3"] {
        mutate
          { replace => { "[ebauth][context][authncontextclassref]" => "http://surfconext.nl/assurance/loa1"}
        }
  }
}

output {
    if [prog] == "EBAUTH" {
        influxdb {
            host => "localhost"
            port => 8086
            db => "log_logins"
            measurement => "EBAUTH"
            retention_policy => "autogen"
            use_event_fields_for_data_points => false
            allow_time_override => true
            time_precision => "u"
            data_points => {
                "idp_entity_id" => "%{[ebauth][context][idp_entity_id]}"
                "user_id" => "%{[ebauth][context][user_id_hashed]}"
                "sp_entity_id" => "%{[ebauth][context][sp_entity_id]}"
                "state" => "%{[ebauth][context][workflow_state]}"
                "authncontextclassref" => "%{[ebauth][context][authncontextclassref]}"
                "time" => "%{[ebauth][context][micro_seconds]}"
                "month" => "%{+MM}"
                "year" => "%{+YYYY}"
                "quarter" => "%{[quarter]}"
            }
            send_as_tags =>  ["idp_entity_id","sp_entity_id","state","month","year","quarter","authncontextclassref"]
          }
    }
}
