---
- name: Create required directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: 1000
    group: 1000
    mode: 0750
  with_items:
    - /opt/openconext/logstash/config
    - /opt/openconext/logstash/conf.d/core
    - /data/logstash

- name: Place logstash settings files
  ansible.builtin.copy:
    src: "files/{{ item }}"
    dest: "/opt/openconext/logstash/config/{{ item }}"
    owner: 1000
    group: 1000
    mode: 0644
  with_items:
    - jvm.options
    - pipelines.yml
    - log4j2.properties

- name: Place logstash config file
  ansible.builtin.template:
    src: templates/logstash.yml.j2
    dest: /opt/openconext/logstash/config/logstash.yml
    owner: 1000
    group: 1000
    mode: 0644

- name: Place core config files
  ansible.builtin.copy:
    src: "files/core/{{ item }}"
    dest: "/opt/openconext/logstash/conf.d/core/{{ item }}"
    owner: 1000
    group: 1000
    mode: 0644
  with_items:
    - 02-filebeat-input.conf
    - 13-core-ebauth.conf

- name: Place core config file for influxdb
  ansible.builtin.template:
    src: templates/33-core-influxdb-output.conf.j2
    dest: /opt/openconext/logstash/conf.d/core/33-core-influxdb-output.conf
    owner: 1000
    group: 1000
    mode: 0644

- name: Create logstash container
  community.docker.docker_container:
    name: "logstash"
    image: "ghcr.io/openconext/openconext-basecontainers/logstash8:latest"
    state: started
    restart_policy: "always"
    networks:
      - name: "loadbalancer"
    ports:
      - 5044:5044
    mounts:
      - source: /opt/openconext/logstash/config
        target: /usr/share/logstash/config
        type: bind
      - source: /opt/openconext/logstash/conf.d/
        target: /etc/logstash/conf.d/
        type: bind
      - source: /data/logstash/
        target: /data/logstash/
        type: bind
