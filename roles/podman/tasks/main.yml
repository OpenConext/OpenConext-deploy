---
# tasks file for podman

# config file
# router file
# key
# traefikless network

- name: Message for non redhat family servers
  when: ansible_facts['os_family'] != 'RedHat'
  ansible.builtin.fail:
    msg: "Sorry, this role only works on RedHat family servers"

- name: Install podman
  ansible.builtin.dnf:
    name: podman
    state: present

- include_tasks: podman_traefik_instances.yml
  when: podman_traefik_instances is defined
  loop: "{{ podman_traefik_instances }}"

- include_tasks: podman_instances.yml
  when: podman_instances is defined
  loop: "{{ podman_instances }}"