---
# tasks file for podman

- name: Message for non redhat family servers
  when: ansible_facts['os_family'] != 'RedHat'
  ansible.builtin.fail:
    msg: "Sorry, this role only works on RedHat family servers"

- name: Install podman
  ansible.builtin.dnf:
    name: podman
    state: present

- name: Add traefik group
  ansible.builtin.group:
    name: traefik
    gid: "{{ podman_traefik_gid }}"

- name: Add traefik user
  ansible.builtin.user:
    name: traefik
    group: traefik
    uid: "{{ podman_traefik_uid }}"

- name: Create a traefik systemctl file
  ansible.builtin.template:
    src: traefik-container.service.j2
    dest: /etc/systemd/system/traefik-container.service
    group: root
    setype: root
    mode: '0755'

- name: Start traefik service
  ansible.builtin.systemctl:
    name: traefik-container.service
    state: started
    enabled: true